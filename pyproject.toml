[project]
name = "ag-ui-hermes"
version = "0.1.0"
description = "AG-UI adapter for the Hermes Agent /v1/runs API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felix Wegener", email = "120452252+flix-wg@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["ag-ui", "hermes", "agent", "sse"]
dependencies = [
    "ag-ui-protocol>=1.0.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
