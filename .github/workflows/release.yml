name: Release

# Nothing publishes without passing checks and manual approval: the build needs the
# python and js jobs, and both publish jobs run in environments (pypi, npm) that must be
# configured with required reviewers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint:package
      - run: npm test

  build:
    needs: [python, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py="$(uv version --short)"
          js="$(node -p "require('./js/package.json').version")"
          test "$tag" = "$py" && test "$tag" = "$js" || { echo "tag $tag, python $py, js $js"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: mkdir -p ../dist-js && npm pack --pack-destination ../dist-js
        working-directory: js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-dist
          path: dist-js/
          if-no-files-found: error

  # One-time setup on pypi.org: add a trusted publisher (owner flix-wg, repository
  # ag-ui-hermes, workflow release.yml, environment pypi), as a pending publisher
  # before the first upload.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # One-time setup on npmjs.com: package ag-ui-hermes -> Settings -> Trusted Publisher ->
  # GitHub Actions (organization/user flix-wg, repository ag-ui-hermes, workflow filename
  # release.yml, environment npm). No NPM_TOKEN secret is used. Trusted publishing needs
  # npm >= 11.5.1, which Node 22 does not bundle, hence the npm upgrade below.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11.6.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: js-dist
          path: dist-js/
      - run: npm publish ./dist-js/*.tgz --provenance --access public
